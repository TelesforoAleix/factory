<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
<title id="title">Factory in the Home Lab system</title>
<desc id="desc">My phone and laptop reach Workshop, Factory’s console, or the platform’s Telegram bot. Factory sends work through the Home Lab run API to Codex or Claude Code in a sandbox on the Linux node. The platform delivers a branch to GitHub; Factory manages the pull request, CI and merge.</desc>
