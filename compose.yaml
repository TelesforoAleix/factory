# Owner-installed at cutover; see docs/node.md for prerequisites.
# Required per-service env files are owner-provided non-secret configuration.
services:
  ui:
    image: homelab-deployer-factory:${HOMELAB_DEPLOY_TAG:?commit required}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    logging: {driver: journald}
    networks: [homelab_default]
    user: 992:978
    command:
    - python
    - -m
    - factory_ui.serve
    environment:
      CPLANE_DATABASE_URL_FILE: /run/secrets/database-url
      HOME: /tmp
      CPLANE_STATE: /srv/factory/briefs/slices.json
      CPLANE_RUNS: /srv/factory/runs
      CPLANE_REPOS: /srv/factory/work
      CPLANE_UI_DOCS: /var/lib/factory/workshop/ui-docs
      FACTORY_UI_HOST: 0.0.0.0
      HOMELAB_API_URL: http://api:8000
    env_file:
    - path: ./ui.env
      required: true
    ports:
    - 127.0.0.1:8300:8300
    volumes:
    - type: bind
      source: /var/lib/factory/workshop
      target: /var/lib/factory/workshop
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /etc/factory/secrets/ui/database-url
      target: /run/secrets/database-url
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/', timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  intake:
    image: homelab-deployer-factory:${HOMELAB_DEPLOY_TAG:?commit required}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    logging: {driver: journald}
    networks: [homelab_default]
    user: 991:977
    command:
    - python
    - -m
    - cplane.intake
    environment:
      CPLANE_DATABASE_URL_FILE: /run/secrets/database-url
      HOME: /tmp
      CPLANE_INTAKE_GID: '977'
    volumes:
    - type: bind
      source: /run/factory-intake
      target: /run/factory-intake
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /etc/factory/secrets/intake/database-url
      target: /run/secrets/database-url
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; s = socket.socket(socket.AF_UNIX); s.settimeout(5); s.connect('/run/factory-intake/intake.sock');
        s.close()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  sessions:
    image: homelab-deployer-factory:${HOMELAB_DEPLOY_TAG:?commit required}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    logging: {driver: journald}
    networks: [homelab_default]
    user: 21011:21011
    command:
    - python
    - -m
    - cplane.sessions
    environment:
      CPLANE_DATABASE_URL_FILE: /run/secrets/database-url
      CPLANE_BRIEFS_KEY: /run/secrets/briefs-key
      CPLANE_BRIEFS_KNOWN_HOSTS: /run/secrets/briefs-known-hosts
      CPLANE_PLANNING_WRITE_KEY: /run/secrets/planning-write-key
      CPLANE_GITHUB_APP_KEY: /run/secrets/github-app.pem
      CPLANE_GITHUB_AUTH: app
      CPLANE_BRIEFS_OWNER_UID: '21010'
      CPLANE_SESSIONS_CLEAN_ROOT: /srv/factory/clean-sessions
      CPLANE_SESSION_RUNS: /srv/factory/runs/sessions
      CPLANE_SESSIONS_LOCK: /var/lib/factory/sessions/sessions.lock
      CPLANE_UI_DOCS: /var/lib/factory/workshop/ui-docs
      CPLANE_FENCE_COMMAND: socket
      HOME: /tmp
      GH_CONFIG_DIR: /tmp/.config/gh
    env_file:
    - path: ./sessions.env
      required: true
    group_add:
    - '976'
    - '21000'
    volumes:
    - type: bind
      source: /srv/factory/work
      target: /srv/factory/work
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /var/lib/factory/workshop
      target: /var/lib/factory/workshop
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/factory/clean-sessions
      target: /srv/factory/clean-sessions
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/factory/runs/sessions
      target: /srv/factory/runs/sessions
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /var/lib/factory/sessions
      target: /var/lib/factory/sessions
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/factory/briefs
      target: /srv/factory/briefs
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/factory/runs
      target: /srv/factory/runs
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /run/homelab-launcher.sock
      target: /run/homelab-launcher.sock
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /etc/factory/secrets/sessions/database-url
      target: /run/secrets/database-url
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /etc/factory/secrets/sessions/github-app.pem
      target: /run/secrets/github-app.pem
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /etc/factory/secrets/sessions/briefs-key
      target: /run/secrets/briefs-key
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /etc/factory/secrets/sessions/briefs-known-hosts
      target: /run/secrets/briefs-known-hosts
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /etc/factory/secrets/sessions/planning-write-key
      target: /run/secrets/planning-write-key
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import os; os.kill(1, 0); from cplane.state import database_url; import psycopg;
        c = psycopg.connect(database_url(), connect_timeout=5); c.execute('SELECT
        1'); c.close()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  runner:
    image: homelab-deployer-factory:${HOMELAB_DEPLOY_TAG:?commit required}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 256
    restart: unless-stopped
    logging: {driver: journald}
    networks: [homelab_default]
    user: 21010:21010
    command:
    - cplane
    - --actor
    - runner
    - run
    - --every
    - '60'
    environment:
      CPLANE_DATABASE_URL_FILE: /run/secrets/database-url
      CPLANE_GITHUB_APP_KEY: /run/secrets/github-app.pem
      CPLANE_BRIEFS_KEY: /run/secrets/briefs-key
      CPLANE_BRIEFS_KNOWN_HOSTS: /run/secrets/briefs-known-hosts
      CPLANE_PLANNING_WRITE_KEY: /run/secrets/planning-write-key
      CPLANE_DENY_LIST: /run/secrets/deny-list
      CPLANE_EVAL_TASK_KEY_FILE: /run/secrets/eval-task-key
      HOME: /tmp
      GH_CONFIG_DIR: /tmp/.config/gh
      CPLANE_FENCE: '1'
      CPLANE_FENCE_COMMAND: socket
      CPLANE_USAGE_SOURCE: launcher
      CPLANE_DEPLOYER_SOCKET: /run/homelab-deployer.sock
      CPLANE_EVAL_TASK_URL: http://api:8000
      CPLANE_GITHUB_AUTH: app
      CPLANE_STATE: /srv/factory/briefs/slices.json
      CPLANE_RUNS: /srv/factory/runs
      CPLANE_REPOS: /srv/factory/work
      CPLANE_EXPORT_DIR: /srv/homelab/factory-state
      CPLANE_BOT_EXPORT: /srv/factory/bot-export
    env_file:
    - path: ./runner.env
      required: true
    group_add:
    - '976'
    - '975'
    - '21000'
    volumes:
    - type: bind
      source: /srv/factory/briefs
      target: /srv/factory/briefs
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/factory/runs
      target: /srv/factory/runs
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/factory/work
      target: /srv/factory/work
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/factory/clean
      target: /srv/factory/clean
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/factory/exports
      target: /srv/factory/exports
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/factory/bot-export
      target: /srv/factory/bot-export
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/homelab/factory-state
      target: /srv/homelab/factory-state
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /run/homelab-launcher.sock
      target: /run/homelab-launcher.sock
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /run/homelab-deployer.sock
      target: /run/homelab-deployer.sock
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /etc/factory/secrets/runner/database-url
      target: /run/secrets/database-url
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /etc/factory/secrets/runner/github-app.pem
      target: /run/secrets/github-app.pem
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /etc/factory/secrets/runner/briefs-key
      target: /run/secrets/briefs-key
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /etc/factory/secrets/runner/briefs-known-hosts
      target: /run/secrets/briefs-known-hosts
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /etc/factory/secrets/runner/planning-write-key
      target: /run/secrets/planning-write-key
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /etc/factory/secrets/runner/deny-list
      target: /run/secrets/deny-list
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /etc/factory/secrets/runner/eval-task-key
      target: /run/secrets/eval-task-key
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import os; os.kill(1, 0); from cplane.state import database_url; import psycopg;
        c = psycopg.connect(database_url(), connect_timeout=5); c.execute('SELECT
        1'); c.close()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
networks:
  homelab_default:
    external: true
    name: homelab_default
